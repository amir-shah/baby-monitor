[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "babymon"
version = "1.0.0"
description = "Raspberry Pi baby sleep monitor: camera, cry detection, event log, HomeKit/HKSV bridge, and sleep analytics"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Amir Shah" }]
keywords = ["raspberry-pi", "baby-monitor", "homekit", "hksv", "sleep-tracking"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.11",
  "Topic :: Home Automation",
]

# Kept deliberately small. Everything that is awkward to build on a Pi
# (numpy is the one heavy dependency, and piwheels has it) is either optional
# or has a pure-Python fallback. See the extras below.
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "numpy>=1.24",
  "itsdangerous>=2.1",
  "python-multipart>=0.0.9",
  # JPEG encoding for snapshots. picamera2 and ffmpeg each have their own
  # encoder, but the v4l2 and synthetic sources do not, and the HomeKit bridge
  # asks for a still whenever anyone opens the Home app.
  "pillow>=10.0",
]

[project.optional-dependencies]
# Sound classification with YAMNet. Falls back to the heuristic classifier
# when this is absent, so the monitor still works without it.
ml = ["ai-edge-litert>=1.0; platform_machine=='aarch64' or platform_machine=='x86_64'"]

# Raspberry Pi camera stack. python3-picamera2 is an apt package and is NOT
# pip-installable; create the venv with --system-site-packages so it is
# visible. Listed here only for documentation.
pi = [
  "RPi.GPIO>=0.7; platform_machine=='armv7l' or platform_machine=='aarch64'",
  "adafruit-circuitpython-dht>=4.0",
  "adafruit-circuitpython-bme280>=2.6",
  "adafruit-circuitpython-sht31d>=2.3",
  "adafruit-blinka>=8.0",
]

# Audio capture through PortAudio. The ffmpeg/arecord subprocess backend is
# used automatically when sounddevice is unavailable.
audio = ["sounddevice>=0.4.6"]

dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  # Only ever imported by tests/test_stats_vs_scipy.py, which uses it as a
  # differential oracle for the pure-Python statistics. Never a runtime import:
  # a 33 MB wheel unpacking to 130 MB has no place on a Pi for maths that runs
  # in microseconds without it.
  "scipy>=1.11; python_version<'3.13'",
]

[project.scripts]
babymon = "babymon.__main__:main"
babymon-setup = "babymon.setup_cli:main"

[tool.setuptools.packages.find]
include = ["babymon*"]

[tool.setuptools.package-data]
babymon = ["storage/*.sql", "api/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:babymon.*"]
addopts = "-q --strict-markers"
markers = [
  "hardware: requires real Pi hardware (camera, mic, GPIO); skipped by default",
  "slow: takes more than a second",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "B008",   # FastAPI's Depends() in defaults is the documented idiom
  "SIM108", # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = []
